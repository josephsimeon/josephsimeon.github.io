<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial scale=1.0">
    <meta http-equiv="X-UA-Compatiable" content="ie-edge">
    <meta name="author" content="Joseph Simeon">
    <meta name="description" content="Portfolio of Joseph Simeon">

    <link rel="stylesheet" type="text/css" href="css/style.css">

    <title>Portfolio of Joseph Simeon</title>
    <link rel="shortcut icon" type="icon/x-icon" href="https://josephsimeon.github.io/img/Memoji.ico">
</head>
<body>
    <header>
        <div class="sticky-header">
            <a href="./docs/cv.pdf" target="_blank" rel="noopener noreferrer">
                <button class="cv_button shine_button">CV</button>
            </a>
        </div>
    </header>
    <main>
        <!-- information block: image, name, career, email, location, socials -->
        <div class="block info_block">
            <div class="info_card">
                <img src="img/Memoji.jpg" alt="Apple memoji self image">
                <div class="title">
                    <div id="name">Joseph Simeon</div>
                    <div id="career">Embedded engineer</div>
                </div>
            </div>
            <div class="info_contact">
                <div class="info_email">
                    <svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="5" width="18" height="14" rx="2" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <div id="email">josephdmsimeon@gmail.com</div>
                </div>
                <div class="info_location">
                    <svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div id="location">Brisbane, Australia.</div>
                </div>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
<html>
